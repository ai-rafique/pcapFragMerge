name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python:
          - "3.9"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile the modules
        run: python -m py_compile pcapchunk.py pcapchunk_gui.py

      - name: Run the unit tests
        run: python -m unittest discover -s tests -v

  build:
    name: PyInstaller build (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    # The spec embeds a Windows icon and version resource; build the Windows
    # one-directory bundle here. Build other platforms with the same spec on
    # their own runners (PyInstaller does not cross-compile).
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build the executable
        run: pyinstaller PcapChunk.spec

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PcapChunk-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
